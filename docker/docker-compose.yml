name: hono-elplus-admin

services:
  infra:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    container_name: hono-elplus-admin
    ports:
      - "3307:3306"
      - "6380:6379"
    env_file:
      - ../.env.dev
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hono_elplus_admin}
    volumes:
      - hono_elplus_admin_mysql_data:/var/lib/mysql
      - hono_elplus_admin_redis_data:/data
    restart: unless-stopped

volumes:
  hono_elplus_admin_mysql_data:
    name: hono_elplus_admin_mysql_data
  hono_elplus_admin_redis_data:
    name: hono_elplus_admin_redis_data
